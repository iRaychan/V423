<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KeySelector BFI · V4.23.02</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#17233a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:18px;background:#f5f7fb}.shell{max-width:1180px;margin:auto}.hero,.card{background:#fff;border:1px solid #dfe6f0;border-radius:14px;box-shadow:0 3px 14px rgba(24,43,77,.05)}.hero{padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;gap:14px;align-items:center}.hero h1{font-size:21px;margin:0}.muted{color:#66738a;font-size:13px}.badge{background:#e8f0ff;color:#1d4f9d;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12px}.card{padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#44516a}.field input,.field select{width:100%;padding:9px 10px;border:1px solid #ccd6e5;border-radius:8px;background:white}.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#155ac8;color:#fff}.btn.secondary{background:#eef3fb;color:#2a4266}.btn.green{background:#147a56}.btn.orange{background:#c16b12}.results{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.model-title{font-size:22px;font-weight:800;margin-bottom:6px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fact{background:#f5f8fc;border-radius:9px;padding:9px}.fact b{display:block;font-size:12px;color:#65718a}.fact span{font-size:15px;font-weight:700}.alts{display:grid;gap:7px}.alt{display:grid;grid-template-columns:1.4fr .7fr .7fr .7fr;gap:6px;border:1px solid #dfe6f0;border-radius:8px;padding:8px;cursor:pointer;background:#fff}.alt:hover{border-color:#7aa7e8;background:#f7fbff}.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chartbox{border:1px solid #dfe6f0;border-radius:10px;padding:9px}.chart-title{font-size:12px;font-weight:800;color:#44516a;margin-bottom:4px}.chartbox svg{width:100%;height:230px;display:block}.tech{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tech table{width:100%;border-collapse:collapse;font-size:12px}.tech td{border-bottom:1px solid #e9edf4;padding:7px 5px}.tech td:first-child{font-weight:700;color:#53617a;width:45%}.empty{padding:28px;text-align:center;color:#6e7a90}.notice{padding:9px 11px;border-radius:8px;background:#fff7df;color:#775518;font-size:12px;margin-top:10px}@media(max-width:860px){.grid{grid-template-columns:1fr 1fr}.results,.charts,.tech{grid-template-columns:1fr}.facts{grid-template-columns:1fr 1fr}}@media print{body{background:#fff;padding:0}.no-print{display:none!important}.hero,.card{box-shadow:none;border-color:#bbb;break-inside:avoid}.print-page{page-break-before:always}.charts{grid-template-columns:1fr 1fr}.chartbox svg{height:215px}}
</style>
</head>
<body>
<div class="shell">
  <div class="hero"><div><h1><span id="brandName">B.G.Reich</span> · <span id="seriesName">BFI</span></h1><div class="muted">Horizontal multistage pump selection · 50 Hz · KeySuite V4.23.02</div></div><span class="badge">BFI</span></div>
  <div class="card no-print" id="dutyCard">
    <div class="grid">
      <div class="field"><label>Flow</label><input id="flow" type="number" min="0" step="0.1" placeholder="m³/hr"></div>
      <div class="field"><label>Flow Unit</label><select id="flowUnit"><option value="m3h">m³/hr</option><option value="lpm">L/min</option><option value="lps">L/s</option><option value="usgpm">US gpm</option><option value="igpm">Imp gpm</option></select></div>
      <div class="field"><label>Head</label><input id="head" type="number" min="0" step="0.1" placeholder="m"></div>
      <div class="field"><label>Head Unit</label><select id="headUnit"><option value="m">m</option><option value="ft">ft</option><option value="bar">bar</option><option value="psi">psi</option><option value="kpa">kPa</option></select></div>
      <div class="actions"><button class="btn" id="selectBtn">Select Pump</button><button class="btn secondary" id="clearBtn">Clear</button></div>
    </div>
  </div>
  <div class="card no-print">
    <div class="grid">
      <div class="field"><label>Exact Model</label><select id="modelSelect"><option value="">Auto selection</option></select></div>
      <div class="field"><label>Supply</label><select id="phase"><option value="3Ph">3 Phase</option><option value="1Ph">1 Phase</option></select></div>
      <div class="field"><label>Mechanical Seal</label><select id="seal"><option value="Car/Cer">Carbon / Ceramic</option><option value="SiC/SiC">SiC / SiC</option><option value="TC/TC">TC / TC</option></select></div>
      <div class="field"><label>Elastomer</label><select id="elastomer"><option>Viton</option><option>EPDM</option><option>NBR</option></select></div>
      <div class="actions"><button class="btn secondary" id="printBtn">PDF / Print</button></div>
    </div>
  </div>
  <div id="output"><div class="card empty">Enter Flow &amp; Head, or choose an exact BFI model.</div></div>
</div>
<script src="../supabase/functions/shared-bfi/bfi-data.js?v=42302"></script>
<script src="../supabase/functions/shared-bfi/bfi-selector-core.js?v=42302"></script>
<script>
(()=>{'use strict';
const DB=window.KeySuiteBFIData,CORE=window.KeySuiteBFICore,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const productMode=new URLSearchParams(location.search).get('product')==='1';let ctx={name:'B.G.Reich',brandSeries:'BFI',sellingSeries:'BFI'},current=null,lastDuty=null;
const n=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—';
function flowM3h(v,u){v=Number(v);return u==='lpm'?v*.06:u==='lps'?v*3.6:u==='usgpm'?v*.227124:u==='igpm'?v*.272765:v}
function headM(v,u){v=Number(v);return u==='ft'?v*.3048:u==='bar'?v*10.1972:u==='psi'?v*.70307:u==='kpa'?v*.101972:v}
function displayModel(m){const series=String(ctx.sellingSeries||ctx.brandSeries||'BFI').trim();return series&&series.toUpperCase()!=='BFI'?String(m||'').replace(/^BFI\b/i,series):String(m||'')}
function familyNo(model){return String(model?.series||'').replace(/\D/g,'')}
function chosenPhase(model){const preferred=$('phase').value;return model?.phases?.includes(preferred)?preferred:(model?.phases?.[0]||'3Ph')}
function evalExact(model,q=null,h=null){const curve=DB.curves[familyNo(model)];if(!curve)return null;const qs=(curve.flow||[]).filter(Number.isFinite),flow=q>0?q:(qs[Math.max(1,Math.floor(qs.length*.62))]||1);const ev=CORE.evaluateModel(DB,model,flow,h||0,50);return ev?{...ev,margin:h>0?ev.predHead-h:0}:null}
function fitSvg(title,fit,dutyX,dutyY,unit,zero=false){const pts=CORE.sampleFit(fit,100);if(!pts.length)return `<div class="chartbox"><div class="chart-title">${title}</div><div class="empty">No curve</div></div>`;const W=520,H=250,P=38,minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minY=zero?0:Math.min(...pts.map(p=>p.y))*0.9,maxY=Math.max(...pts.map(p=>p.y))*1.08;const sx=x=>P+(x-minX)/(maxX-minX||1)*(W-2*P),sy=y=>H-P-(y-minY)/(maxY-minY||1)*(H-2*P);const path=pts.map((p,i)=>`${i?'L':'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');let grid='';for(let i=0;i<=5;i++){const x=P+(W-2*P)*i/5,y=P+(H-2*P)*i/5;grid+=`<line x1="${x}" y1="${P}" x2="${x}" y2="${H-P}" stroke="#e8edf4"/><line x1="${P}" y1="${y}" x2="${W-P}" y2="${y}" stroke="#e8edf4"/>`;}const dot=Number.isFinite(dutyX)&&Number.isFinite(dutyY)?`<circle cx="${sx(dutyX)}" cy="${sy(dutyY)}" r="5" fill="#c53b30"/><text x="${sx(dutyX)+8}" y="${sy(dutyY)-7}" font-size="11" fill="#81251f">Duty</text>`:'';return `<div class="chartbox"><div class="chart-title">${title}</div><svg viewBox="0 0 ${W} ${H}" role="img"><rect x="${P}" y="${P}" width="${W-2*P}" height="${H-2*P}" fill="#fff" stroke="#cfd8e6"/>${grid}<path d="${path}" fill="none" stroke="#2469b8" stroke-width="3"/>${dot}<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="#66738a">Flow m³/hr</text><text x="10" y="${H/2}" transform="rotate(-90 10 ${H/2})" text-anchor="middle" font-size="11" fill="#66738a">${unit}</text></svg></div>`}
function payload(){if(!current)return null;const model=DB.byModel(current.model)||current,phase=chosenPhase(model);return {source:'KeySelector-BFI-V4.23.02',family:'BFI',product:'BFI',productFamily:'BFI',keysuite_product_group_code:'BFI',keysuite_price_group_code:'BFI',model:model.model,base_model:model.model,display_model:displayModel(model.model),series:model.series,stages:model.stages,connection:model.connection,inlet:model.inlet,outlet:model.outlet,max_pressure_bar:model.max_pressure_bar,max_inlet_bar:model.max_inlet_bar,motor_kw:model.motor_kw,motor_hp:model.motor_hp,motor_phase:phase,phase,flow_m3h:lastDuty?.q||current._keysuiteDutyFlow||null,head_m:lastDuty?.h||current.predHead||null,efficiency:current.eff,npshr:current.npsh,frequency_hz:50,rpm:current.rpm||2900,pole:2,keysuite_seal:$('seal').value,keysuite_elastomer:$('elastomer').value,brand_name:ctx.name||'B.G.Reich',brand_series:ctx.brandSeries||'BFI',selling_series:ctx.sellingSeries||'BFI',phases:model.phases,dimensions:model.dimensions,weight_kg:model.weight_kg,total_impellers:model.totalImpellers,full_impellers:model.fullImpellers,reduced_impellers:model.smallImpellers};}
function render(candidate,alternatives=[]){current=candidate;if(!candidate){$('output').innerHTML='<div class="card empty">No suitable BFI model matched this duty point.</div>';return}const model=DB.byModel(candidate.model)||candidate,phase=chosenPhase(model);$('phase').value=phase;[...$('phase').options].forEach(o=>o.disabled=!model.phases.includes(o.value));const q=lastDuty?.q||candidate._keysuiteDutyFlow||candidate.headFit?.min||0,h=lastDuty?.h||candidate.predHead;const bep=CORE.bepInfo(candidate,q);const dims=Object.entries(model.dimensions||{}).filter(([,v])=>v!==null&&v!==''&&v!==undefined);const reduced=model.smallImpellers?`${model.fullImpellers} full + ${model.smallImpellers} reduced`:`${model.totalImpellers}`;const altHtml=alternatives.slice(0,6).map(a=>`<button type="button" class="alt" data-model="${esc(a.model)}"><b>${esc(displayModel(a.model))}</b><span>${n(a.motor_kw,2)} kW</span><span>${n(a.predHead,1)} m</span><span>${n(a.eff,1)}%</span></button>`).join('')||'<div class="muted">No alternatives.</div>';$('output').innerHTML=`
<div class="results"><div class="card"><div class="model-title">${esc(displayModel(model.model))}</div><div class="muted">Most suitable BFI model · ${esc(ctx.name||'B.G.Reich')}</div><div class="facts" style="margin-top:12px"><div class="fact"><b>Duty</b><span>${n(q,1)} m³/hr @ ${n(h,1)} m</span></div><div class="fact"><b>Motor</b><span>${n(model.motor_kw,2)} kW / ${n(model.motor_hp,2)} HP</span></div><div class="fact"><b>Efficiency</b><span>${n(candidate.eff,1)}%</span></div><div class="fact"><b>NPSHr</b><span>${n(candidate.npsh,1)} m</span></div><div class="fact"><b>Connection</b><span>${esc(model.connection)}</span></div><div class="fact"><b>Supply</b><span>${esc(phase)}</span></div><div class="fact"><b>Impellers</b><span>${esc(reduced)}</span></div><div class="fact"><b>Max O.P.</b><span>${n(model.max_pressure_bar,1)} bar</span></div></div><div class="actions no-print" style="margin-top:14px"><button class="btn green" id="assemblyBtn">Assembly</button><button class="btn orange" id="quoteBtn">Quote</button></div>${model.smallImpellers?'<div class="notice">Reduced-impeller model: hydraulic head uses the uploaded BFI reduced-impeller curve for the final impeller.</div>':''}</div><div class="card"><h3 style="margin-top:0">Alternative Models</h3><div class="alts">${altHtml}</div></div></div>
<div class="card print-page"><h2 style="margin-top:0">Performance Curves · ${esc(displayModel(model.model))}</h2><div class="charts">${fitSvg('Head Curve',candidate.headFit,q,candidate.predHead,'Head (m)')}${fitSvg('Efficiency Curve',candidate.effFit,q,candidate.eff,'Efficiency (%)',true)}${fitSvg('Power Curve',candidate.powerFit,q,candidate.shaft,'Shaft Power (kW)',true)}${fitSvg('NPSHr Curve',candidate.npshFit,q,candidate.npsh,'NPSHr (m)',true)}</div><div class="muted" style="margin-top:8px">BEP approx. ${n(bep.flow,1)} m³/hr @ ${n(bep.eff,1)}% · Curve frequency 50 Hz.</div></div>
<div class="card tech print-page"><div><h2>Technical Data</h2><table><tr><td>Model</td><td>${esc(displayModel(model.model))}</td></tr><tr><td>Stages</td><td>${model.stages}</td></tr><tr><td>Impeller configuration</td><td>${esc(reduced)}</td></tr><tr><td>Motor</td><td>${n(model.motor_kw,2)} kW / ${n(model.motor_hp,2)} HP · 2 Pole · ${esc(phase)} · 50 Hz</td></tr><tr><td>Inlet / Outlet</td><td>${esc(model.inlet)} / ${esc(model.outlet)}</td></tr><tr><td>Maximum operating pressure</td><td>${n(model.max_pressure_bar,1)} bar</td></tr><tr><td>Maximum inlet pressure</td><td>${n(model.max_inlet_bar,1)} bar</td></tr><tr><td>Weight</td><td>${n(model.weight_kg,1)} kg</td></tr><tr><td>Mechanical Seal</td><td>${esc($('seal').value)}</td></tr><tr><td>Elastomer</td><td>${esc($('elastomer').value)}</td></tr></table></div><div><h2>Dimensions (mm)</h2><table>${dims.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div></div>`;
$('output').querySelectorAll('.alt').forEach(b=>b.onclick=()=>openExact(b.dataset.model));$('assemblyBtn').onclick=()=>parent.postMessage({type:'KEYSUITE_ADD_SELECTION',route:'assembly',payload:payload()},'*');$('quoteBtn').onclick=()=>parent.postMessage({type:'KEYSUITE_ADD_SELECTION',route:'quotation',payload:payload()},'*');
}
function run(){const q=flowM3h($('flow').value,$('flowUnit').value),h=headM($('head').value,$('headUnit').value);if(!(q>0&&h>0)){render(null);return}lastDuty={q,h};const result=CORE.select(DB,q,h,50);render(result.selected,result.candidates.filter(x=>x.model!==result.selected?.model));}
function openExact(name,q=null,h=null){const model=DB.byModel(name);if(!model)return false;$('modelSelect').value=model.model;const qq=q>0?q:(lastDuty?.q||null),hh=h>0?h:(lastDuty?.h||null);const ev=evalExact(model,qq,hh);if(!ev)return false;if(qq>0)lastDuty={q:qq,h:hh>0?hh:ev.predHead};render(ev,[]);return true}
DB.models.slice().sort((a,b)=>a.model.localeCompare(b.model,undefined,{numeric:true})).forEach(m=>{const o=document.createElement('option');o.value=m.model;o.textContent=m.model;$('modelSelect').appendChild(o)});
$('selectBtn').onclick=run;$('clearBtn').onclick=()=>{$('flow').value='';$('head').value='';$('modelSelect').value='';lastDuty=null;current=null;$('output').innerHTML='<div class="card empty">Enter Flow &amp; Head, or choose an exact BFI model.</div>'};$('modelSelect').onchange=()=>{$('modelSelect').value&&openExact($('modelSelect').value)};$('phase').onchange=()=>current&&render(current,[]);$('seal').onchange=()=>current&&render(current,[]);$('elastomer').onchange=()=>current&&render(current,[]);$('printBtn').onclick=()=>window.print();
window.addEventListener('message',ev=>{const m=ev.data||{};if(m.type==='KEYSUITE_V393_BRAND_CONTEXT'){ctx={...ctx,...(m.brand||{})};$('brandName').textContent=ctx.name||'B.G.Reich';$('seriesName').textContent=ctx.brandSeries||ctx.sellingSeries||'BFI';return}if(m.type==='KEYSUITE_DASHBOARD_SELECT'){const q=Number(m.flowM3h),h=Number(m.headM),r=CORE.select(DB,q,h,50),s=r.selected;parent.postMessage({type:'KEYSUITE_DASHBOARD_RESULT',requestId:m.requestId,family:'BFI',suitable:!!s,data:s?{model:s.model,motor_kw:s.motor_kw,motor_hp:s.motor_hp,efficiency:s.eff,eff:s.eff,npshr:s.npsh,pole:2,efficiency_class:'IE3',alternatives:r.candidates.slice(1,7).map(x=>({model:x.model,motor_kw:x.motor_kw,motor_hp:x.motor_hp,efficiency:x.eff,eff:x.eff,npshr:x.npsh,pole:2,efficiency_class:'IE3'}))}:null},'*');return}if(m.type==='KEYSUITE_DASHBOARD_OPEN_MODEL'){const ok=openExact(m.model,Number(m.flowM3h),Number(m.headM));parent.postMessage({type:'KEYSUITE_DASHBOARD_MODEL_OPENED',requestId:m.requestId,family:'BFI',model:m.model,opened:ok},'*');return}if(m.type==='KEYSUITE_PRODUCT_MODEL'){const ok=openExact(m.model);parent.postMessage({type:'KEYSUITE_PRODUCT_CURVE_STATE',family:'BFI',model:m.model,opened:ok},'*')}});
parent.postMessage({type:'KEYSUITE_PRODUCT_FRAME_READY',family:'BFI'},'*');parent.postMessage({type:'KEYSUITE_SELECTOR_HEIGHT',family:'BFI',product:'BFI',height:document.documentElement.scrollHeight},'*');
if(productMode){$('dutyCard').style.display='none'}
})();
</script>
</body></html>
